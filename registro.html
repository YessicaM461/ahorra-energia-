<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar un equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-3">
    
    <header class="p-4 mb-4 bg-primary text-white rounded">
        <h1>Registrar un equipo</h1>
        <p>Escriba los datos de un equipo de su casa.</p>
        <nav class="nav nav-pills">
            <a class="nav-link text-white" href="index.html">Inicio</a>
            <a class="nav-link text-white" href="equipos.html">Equipos de mi casa</a>
            <a class="nav-link text-white active bg-secondary" href="registro.html">Registrar un equipo</a>
            <a class="nav-link text-white" href="mi-factura.html">Mi Factura</a>
            <a class="nav-link text-white" href="encuesta.html">Encuesta</a>
        </nav>
    </header>
    
    <main>
        <form action="registro.html" method="get">
            <fieldset class="border rounded p-3 mb-3">
                <legend class="float-none w-auto px-3 fs-5 fw-bold text-primary">Datos del equipo</legend>
                
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del equipo:</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" required placeholder="Ej.: Nevera">
                </div>
                
                <div class="mb-3">
                    <label for="potencia" class="form-label">Potencia (W):</label>
                    <input class="form-control" type="number" id="potencia" name="potencia" min="1" max="10000" required>
                </div>
                
                <div class="mb-3">
                    <label for="horas" class="form-label">Horas de uso al día:</label>
                    <input class="form-control" type="number" id="horas" name="horas" min="0" max="24" step="0.5" required>
                </div>
                
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo de equipo:</label>
                    <select class="form-select" id="tipo" name="tipo">
                        <option value="calor">Produce calor (ducha, plancha, estufa)</option>
                        <option value="frio">Produce frío (nevera, aire acondicionado)</option>
                        <option value="electronico">Electrónico (televisor, computador)</option>
                        <option value="motor">Tiene motor (lavadora, licuadora)</option>
                    </select>
                </div>
            </fieldset>
            
            <fieldset class="border rounded p-3 mb-3">
                <legend class="float-none w-auto px-3 fs-5 fw-bold text-primary">Uso</legend>
                
                <p class="mb-2 fw-semibold">¿Cuándo lo usa más?</p>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" id="dia" name="momento" value="dia" checked>
                    <label class="form-check-label" for="dia">De día</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" id="noche" name="momento" value="noche">
                    <label class="form-check-label" for="noche">De noche (6 a 9 pm, la hora más cara)</label>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="desconecta" name="desconecta" value="si">
                    <label class="form-check-label" for="desconecta">Lo desconecto cuando no lo uso</label>
                </div>
                
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha del registro:</label>
                    <input class="form-control" type="date" id="fecha" name="fecha">
                </div>
                
                <div class="mb-3">
                    <label for="notas" class="form-label">Observaciones:</label>
                    <textarea class="form-control" id="notas" name="notas" rows="3" placeholder="Ej.: la etiqueta está borrosa"></textarea>
                </div>
            </fieldset>
            
            <button class="btn btn-primary" type="submit">Registrar</button>
            <button class="btn btn-secondary" type="reset">Borrar</button>
        </form>
    </main>
    
    <footer class="mt-4 text-muted border-top pt-3">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>

</body>
</html>
